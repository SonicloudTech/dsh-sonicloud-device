name: 构建与发布

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  build:
    name: 校验、测试与打包
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # 同次运行重试时查询原发布产物。
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id || steps.original.outputs.artifact_id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url || steps.original.outputs.artifact_url }}
    steps:
      - name: 检出触发提交
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: 固定 npm 版本
        id: npm
        run: npm install --global npm@11.16.0
      - name: 校验版本与双语更新日志
        id: prepare
        run: node scripts/ci/release.mjs init
      - name: 查找同次运行的原正式产物
        id: original
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release.mjs find
      - name: 恢复原正式产物
        id: restore
        if: steps.original.outputs.artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.original.outputs.artifact_id }}
          path: artifacts/release
          merge-multiple: true
      - name: 校验 npm 版本与恢复记录
        id: preflight
        env:
          RESTORED_ARTIFACT_ID: ${{ steps.original.outputs.artifact_id }}
        run: node scripts/ci/release.mjs preflight
      - name: 安装依赖
        id: install
        run: npm ci
      - name: 构建与测试
        id: test
        run: npm test
      - name: 打包、检查与生成校验文件
        id: pack
        if: steps.original.outputs.artifact_id == ''
        run: node scripts/ci/release.mjs pack
      - name: 保存已检查产物
        id: upload
        if: steps.original.outputs.artifact_id == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: 写入运行摘要
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          STEP_RESULTS: ${{ toJSON(steps) }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url || steps.original.outputs.artifact_url }}
        shell: bash
        run: |
          if [ -f scripts/ci/release.mjs ]; then
            node scripts/ci/release.mjs summary
          else
            printf '检出失败，未生成产物。请查看 checkout 步骤日志。\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: 发布 npm 正式版
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-production
      cancel-in-progress: false
    steps:
      - name: 检出发布工具
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: 固定 npm 版本
        id: npm
        run: npm install --global npm@11.16.0
      - name: 下载已检查的正式产物
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: artifacts/release
          merge-multiple: true
      - name: 发布并验证 npm 版本、标签与完整性
        id: publish
        run: node scripts/ci/release.mjs publish
      - name: 写入发布摘要
        if: always()
        env:
          RELEASE_JOB: publish
          JOB_STATUS: ${{ job.status }}
          STEP_RESULTS: ${{ toJSON(steps) }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
        shell: bash
        run: |
          if [ -f scripts/ci/release.mjs ]; then
            node scripts/ci/release.mjs summary
          else
            printf '检出失败，未发布 npm。请查看 checkout 步骤日志。\n' >> "$GITHUB_STEP_SUMMARY"
          fi
